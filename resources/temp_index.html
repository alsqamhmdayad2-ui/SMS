<!doctype html>
<!-- ============================================
     School Management System — User Type Selection
     Entry page: choose role (Admin/Teacher/Student/Parent)
     ============================================ -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدرسة نور المعارف - اختيار نوع المستخدم</title>
    <meta
      name="description"
      content="مدرسة نور المعارف - اختر نوع حسابك للدخول إلى النظام"
    />
    <!-- Bootstrap 5.3 RTL CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Auth-specific stylesheet -->
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <!-- Selection page container with gradient background -->
    <div class="selection-container">
      <!-- Floating decorative background shapes -->
      <div
        style="
          position: absolute;
          width: 200px;
          height: 200px;
          border-radius: 50%;
          background: rgba(59, 130, 246, 0.08);
          top: 10%;
          right: 10%;
          animation: pulse 4s ease infinite;
        "
      ></div>
      <div
        style="
          position: absolute;
          width: 150px;
          height: 150px;
          border-radius: 50%;
          background: rgba(96, 165, 250, 0.06);
          bottom: 15%;
          left: 15%;
          animation: pulse 5s ease infinite;
        "
      ></div>
      <div
        style="
          position: absolute;
          width: 100px;
          height: 100px;
          border-radius: 50%;
          background: rgba(139, 92, 246, 0.06);
          top: 60%;
          right: 70%;
          animation: pulse 6s ease infinite;
        "
      ></div>

      <!-- Main content wrapper -->
      <div class="text-center position-relative" style="z-index: 1">
        <!-- Branding: logo and system name -->
        <div class="auth-logo mb-5">
          <div
            class="mx-auto mb-3"
            style="
              width: 90px;
              height: 90px;
              border-radius: 50%;
              background: rgba(255, 255, 255, 0.1);
              backdrop-filter: blur(10px);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 2px solid rgba(255, 255, 255, 0.15);
              box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            "
          >
            <img
              src="assets/img/logo.png"
              alt="Logo"
              style="
                width: 70px;
                height: 70px;
                object-fit: contain;
                border-radius: 50%;
              "
            />
          </div>
          <h2 class="text-white" style="font-size: 1.8rem">
            مدرسة نور المعارف
          </h2>
          <p
            class="mt-2"
            style="color: rgba(255, 255, 255, 0.7); font-size: 0.95rem"
          >
            اختر نوع حسابك للدخول إلى النظام
          </p>
        </div>

        <!-- User type selection grid (2x2) -->
        <div class="selection-grid">
          <!-- Admin card -->
          <a
            href="pages/auth/login.html?type=admin"
            class="selection-card"
            id="admin-card"
          >
            <div class="icon-wrap">
              <i class="fas fa-user-shield"></i>
            </div>
            <h3>مدير النظام</h3>
            <p>إدارة كاملة للنظام</p>
          </a>

          <!-- Teacher card -->
          <a
            href="pages/auth/login.html?type=teacher"
            class="selection-card"
            id="teacher-card"
          >
            <div class="icon-wrap">
              <i class="fas fa-chalkboard-teacher"></i>
            </div>
            <h3>معلم</h3>
            <p>إدارة الحصص والطلاب</p>
          </a>

          <!-- Student card -->
          <a
            href="pages/auth/login.html?type=student"
            class="selection-card"
            id="student-card"
          >
            <div class="icon-wrap">
              <i class="fas fa-user-graduate"></i>
            </div>
            <h3>طالب</h3>
            <p>عرض الدرجات والاختبارات</p>
          </a>

          <!-- Parent card -->
          <a
            href="pages/auth/login.html?type=parent"
            class="selection-card"
            id="parent-card"
          >
            <div class="icon-wrap">
              <i class="fas fa-user-tie"></i>
            </div>
            <h3>ولي أمر</h3>
            <p>متابعة الأبناء</p>
          </a>
        </div>

        <!-- Footer copyright -->
        <p
          class="mt-5 position-relative"
          style="
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.78rem;
            z-index: 1;
          "
        >
          © 2026 مدرسة نور المعارف - جميع الحقوق محفوظة
        </p>
      </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Application scripts -->
    <script src="js/core.js"></script>
  </body>
</html>
